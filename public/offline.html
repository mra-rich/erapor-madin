<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — E-Rapor</title>
  <link rel="icon" type="image/x-icon" href="/assets/img/logo.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      background: #f0fdfa;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 1.5rem; color: #1e293b;
    }
    .card {
      background: #fff; border-radius: 1.5rem; padding: 2.5rem 2rem;
      max-width: 26rem; width: 100%; text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,.08); border: 1px solid #e2e8f0;
    }
    .icon {
      width: 5rem; height: 5rem; margin: 0 auto 1.25rem;
      background: #ecfdf5; border-radius: 1.25rem;
      display: flex; align-items: center; justify-content: center;
      font-size: 2.5rem;
    }
    h1 { font-size: 1.25rem; font-weight: 800; margin-bottom: .5rem; }
    p { font-size: .875rem; color: #64748b; line-height: 1.6; margin-bottom: 1.5rem; }
    .btn {
      display: inline-flex; align-items: center; gap: .5rem;
      background: #10b981; color: #fff; border: none;
      padding: .875rem 1.5rem; border-radius: .875rem;
      font-weight: 700; font-size: .9rem; cursor: pointer;
      text-decoration: none; transition: background .2s;
    }
    .btn:hover { background: #059669; }
    .hint { margin-top: 1rem; font-size: .75rem; color: #94a3b8; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>Anda Sedang Offline</h1>
    <p>Halaman ini belum tersimpan di perangkat. Namun halaman yang pernah Anda buka tetap bisa diakses, dan data yang Anda isi saat offline akan otomatis terkirim ketika koneksi kembali.</p>
    <a href="/dashboard" class="btn">↻ Coba Buka Dashboard</a>
    <p class="hint">Koneksi akan dipantau otomatis…</p>
  </div>
  <script>
    // Auto-reload saat koneksi kembali
    window.addEventListener('online', () => location.reload());
    // Coba muat ulang halaman yang diminta setiap 5 detik
    setInterval(() => { if (navigator.onLine) location.reload(); }, 5000);
  </script>
</body>
</html>
